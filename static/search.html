<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mesaj Arama • RRAENEE</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/assets/css/style.css?v=16.0.0">
<style>*{box-sizing:border-box}body{overflow:auto!important}.wrap{max-width:1450px;margin:auto;padding:32px 26px}.head{margin-bottom:24px}.eyebrow{font-size:10px;color:#53fc18;font-weight:900;letter-spacing:.18em}.title{font-size:36px;font-weight:950;letter-spacing:-.06em;margin:8px 0}.muted{color:#829086;font-size:13px}.filters{display:grid;grid-template-columns:2fr 1.2fr 1fr 1fr auto;gap:10px;padding:18px;border:1px solid #26392b;border-radius:18px;background:#101711}.filters input{height:46px;padding:0 13px}.btn{height:44px;padding:0 18px;border:0;border-radius:11px;background:#53fc18;color:#081008;font-weight:900;cursor:pointer}.results{margin-top:18px;display:grid;gap:10px}.result{padding:17px 18px;border:1px solid #203426;border-radius:15px;background:linear-gradient(120deg,#111a13,#0b100c)}.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:9px}.user{color:#53fc18;font-weight:900}.date{color:#77867b;font-size:11px}.message{font-size:14px;line-height:1.6;overflow-wrap:anywhere}.empty{padding:44px;text-align:center;color:#829086;border:1px dashed #2b4030;border-radius:15px}@media(max-width:900px){.filters{grid-template-columns:1fr 1fr}.filters input:first-child{grid-column:1/-1}}@media(max-width:520px){.wrap{padding:20px 12px}.filters{grid-template-columns:1fr}.filters input:first-child{grid-column:auto}.title{font-size:28px}}</style></head><body><main class="wrap"><header class="head"><div class="eyebrow">RRAENEE / CHAT ARCHIVE</div><h1 class="title">Mesaj arşivinde ara</h1><p class="muted">Kaydedilmiş yayın sohbetlerinde kelime veya kullanıcı adına göre arama yap.</p></header>
<section class="filters"><input id="user" placeholder="Kick kullanıcı adı (tam eşleşme)" required><input id="start" type="date" title="Başlangıç"><input id="end" type="date" title="Bitiş"><button class="btn" id="search">MESAJLARI ARA</button></section><div class="muted" id="status" style="margin:14px 2px">Aramak istediğin Kick kullanıcı adını gir.</div><section class="results" id="results"></section></main>
<script>const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function date(v){const d=new Date(v);return isNaN(d)?esc(v):new Intl.DateTimeFormat('tr-TR',{timeZone:'Europe/Istanbul',dateStyle:'medium',timeStyle:'medium'}).format(d)}async function run(){const p=new URLSearchParams();if($('user').value.trim())p.set('username',$('user').value.trim());if($('start').value)p.set('start',$('start').value+'T00:00:00');if($('end').value)p.set('end',$('end').value+'T23:59:59');$('status').textContent='Aranıyor…';$('results').innerHTML='';try{const r=await fetch('/api/search/messages?'+p);if(r.status===401){location.href='/admin';return}const d=await r.json();$('status').textContent=`${d.count||0} sonuç • ${d.scope||''}`;$('results').innerHTML=d.results?.length?d.results.map(x=>`<article class="result"><div class="meta"><span class="user">${esc(x.username||'Bilinmeyen')}</span><span class="date">${date(x.timestamp)} · ${esc(x.label_date||'Yayın')}</span></div><div class="message">${esc(x.message||'')}</div></article>`).join(''):'<div class="empty">Eşleşen mesaj bulunamadı. Bu arama yalnızca sistemin daha önce kaydettiği mesajları kapsar.</div>'}catch(e){$('status').textContent='Arama sırasında hata oluştu.'}}$('search').onclick=run;$('user').addEventListener('keydown',e=>{if(e.key==='Enter')run()});</script></body></html>
